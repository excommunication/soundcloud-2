<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="SoundCloud 2: облако из рёбрышек эквалайзера загорается по ходу загрузки и превращается в крутящуюся звезду, как в установщике">
