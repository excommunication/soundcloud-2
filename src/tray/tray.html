<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="Content-Security-Policy" content="default-src 'none'; font-src 'self'; script-src 'self'; style-src 'self'; img-src https: data:" />
        <link rel="stylesheet" href="../shared/tokens.css" />
        <link rel="stylesheet" href="tray.css" />
        <script src="tray.js" defer></script>
    </head>
    <body>
        <main class="pop">
            <section class="now" aria-live="polite">
                <div class="art" id="art"></div>
                <div class="meta">
                    <b id="title">Ничего не играет</b>
                    <span id="author">SoundCloud 2</span>
                </div>
            </section>
            <div class="controls">
                <button class="ctl" data-act="previous" aria-label="Предыдущий"><svg viewBox="0 0 16 16"><path d="M3 3h1.6v10H3zM14 3v10L5.6 8z" /></svg></button>
                <button class="ctl main" data-act="toggle" id="play" aria-label="Играть"><svg viewBox="0 0 16 16" id="play-icon"><path d="M4 2.5v11L13.5 8z" /></svg></button>
                <button class="ctl" data-act="next" aria-label="Следующий"><svg viewBox="0 0 16 16"><path d="M11.4 3H13v10h-1.6zM2 3v10l8.4-5z" /></svg></button>
                <button class="ctl like" data-act="like" id="like" aria-label="Лайк" aria-pressed="false"><svg viewBox="0 0 16 16"><path d="M8 14s-5.5-3.3-5.5-7.3A3 3 0 0 1 8 4.6a3 3 0 0 1 5.5 2.1C13.5 10.7 8 14 8 14z" /></svg></button>
            </div>
            <nav class="list">
                <button data-act="open"><svg viewBox="0 0 16 16"><path d="M2.5 3.5h11v9h-11zM2.5 6h11" fill="none" stroke="currentColor" stroke-width="1.3" /></svg><span data-t="open">Открыть SoundCloud 2</span></button>
                <button data-act="appearance"><svg viewBox="0 0 16 16"><path d="M8 1.8a6.2 6.2 0 1 0 0 12.4c.9 0 1.3-.6 1.3-1.2 0-.8-.7-1-.7-1.8 0-.7.6-1.2 1.3-1.2h1.4c1.7 0 2.9-1.3 2.9-3C14.2 4.1 11.5 1.8 8 1.8z" fill="none" stroke="currentColor" stroke-width="1.3" /></svg><span data-t="appearance">Оформление</span></button>
                <button data-act="settings"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.3" /><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke="currentColor" stroke-width="1.3" /></svg><span data-t="settings">Настройки</span></button>
                <label class="switch"><svg viewBox="0 0 16 16"><path d="M2 7c2-3 10-3 12 0M4.5 10.5a1.6 1.6 0 1 0 0 .1M11.5 10.5a1.6 1.6 0 1 0 0 .1M6.2 10.6h3.6" fill="none" stroke="currentColor" stroke-width="1.3" /></svg><span data-t="incognito">Инкогнито в Discord</span><input type="checkbox" id="incognito" /><i></i></label>
                <hr />
                <button data-act="quit" class="quit"><svg viewBox="0 0 16 16"><path d="M8 2v6M4.3 4.2a5 5 0 1 0 7.4 0" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" /></svg><span data-t="quit">Выход</span></button>
            </nav>
        </main>
    </body>
</html>
