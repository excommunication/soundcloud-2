<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'" />
        <link rel="stylesheet" href="update.css" />
    </head>
    <body>
        <div class="back" aria-hidden="true"><i class="blob a"></i><i class="blob b"></i><i class="blob c"></i></div>
        <main class="card" aria-live="polite">
            <div class="ring" id="ring" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <svg class="dial" viewBox="0 0 120 120" aria-hidden="true">
                    <circle class="track" cx="60" cy="60" r="54" />
                    <circle class="arc" id="arc" cx="60" cy="60" r="54" />
                </svg>
                <svg class="logo" viewBox="0 -4 200 96" aria-hidden="true">
                    <g class="bars">
                        <rect x="2" y="45" width="6" height="32" rx="3" />
                        <rect x="15" y="38" width="6" height="46" rx="3" />
                        <rect x="28" y="41" width="6" height="46" rx="3" />
                        <rect x="41.5" y="26" width="6" height="61" rx="3" />
                        <rect x="54.5" y="20" width="6" height="67" rx="3" />
                        <rect x="68" y="23" width="6" height="64" rx="3" />
                        <rect x="81.5" y="13" width="6" height="74" rx="3" />
                    </g>
                    <path d="M100 87Q95 87 95 82V10Q95 5 100 3.5Q108 1 117 1Q155 1 163 36Q167 35 170 35Q193 35 193 61Q193 87 168 87Z" />
                </svg>
            </div>
            <h1 id="title"></h1>
            <p id="status"></p>
            <div class="bar"><div class="fill" id="fill"></div></div>
            <div class="actions">
                <button id="action" type="button" hidden></button>
                <button id="later" type="button"></button>
            </div>
        </main>
        <script src="update.js"></script>
    </body>
</html>
