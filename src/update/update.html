<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="Content-Security-Policy" content="default-src 'none'; font-src 'self'; style-src 'self'; script-src 'self'" />
        <link rel="stylesheet" href="../shared/tokens.css" />
        <link rel="stylesheet" href="update.css" />
    </head>
    <body>
        <main class="card" aria-live="polite">
            <div class="logo" id="logo" role="progressbar" aria-labelledby="title" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div class="scene" aria-hidden="true">
                    <div class="star"><div class="spin" id="rays"></div></div>
                </div>
                <div class="mark" aria-hidden="true">SoundCloud<b>2</b></div>
            </div>
            <div class="body">
                <h1 id="title"></h1>
                <p id="status"></p>
                <div class="bar"><div class="fill" id="fill"></div></div>
                <div class="actions">
                    <button id="action" type="button" hidden></button>
                    <button id="later" type="button"></button>
                </div>
            </div>
        </main>
        <script src="update.js"></script>
    </body>
</html>
