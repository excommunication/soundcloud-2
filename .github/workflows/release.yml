name: Релиз
# Установщик для Windows и релиз на GitHub: по тегу vX.Y.Z, вручную или из синхронизации с оригиналом.
# Клиент обновляется сам по latest.yml из последнего релиза.
# VMP-подпись Widevine ставится, если в Settings → Secrets → Actions заданы EVS_ACCOUNT_NAME и EVS_PASSWD;
# без них сборка выходит без подписи, и треки лейблов с защищённым потоком могут не играть
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, например v2.0.1 (пусто — по версии в package.json)'
        required: false
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npx --yes pnpm@12.15.0 install --frozen-lockfile
      - run: npx --yes pnpm@12.15.0 typecheck
      - run: npx --yes pnpm@12.15.0 exec vitest run --testTimeout=30000 --retry=1
      - name: Ключи EVS для VMP-подписи
        id: evs
        shell: pwsh
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          if ($env:EVS_ACCOUNT_NAME -and $env:EVS_PASSWD) {
            python -m pip install castlabs-evs==1.3.2
            python scripts/evs-auth.py
            if ($LASTEXITCODE -eq 0) {
              "skip=false" >> $env:GITHUB_OUTPUT
            } else {
              # Вход в EVS не прошёл (имя аккаунта, пароль или неподтверждённая почта): релиз выходит без подписи, а не падает
              Write-Output "::warning::Вход в Castlabs EVS не прошёл: проверь секреты EVS_ACCOUNT_NAME и EVS_PASSWD. Сборка без VMP-подписи"
              "skip=true" >> $env:GITHUB_OUTPUT
            }
            $global:LASTEXITCODE = 0
          } else {
            Write-Output "Секретов EVS нет: сборка без VMP-подписи"
            "skip=true" >> $env:GITHUB_OUTPUT
          }
      # Маленький установщик (~115 КБ) до полного: полный вшивает его и открывает вместо своих страниц.
      # Сам он качает полный из этого же релиза, поэтому имя у него без версии
      - run: npx --yes pnpm@12.15.0 build-setup
      - run: npx --yes pnpm@12.15.0 build-win
        env:
          SKIP_VMP_SIGNING: ${{ steps.evs.outputs.skip }}
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
      - name: Релиз на GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = '${{ inputs.tag }}'
          if (-not $tag) { $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { "v$version" } }
          # Имена файлов одни и те же в каждом релизе (2.9.0): ссылка releases/latest/download/<имя> всегда ведёт на последнюю
          # версию, а клиент обновляется по latest.yml. Раньше полный установщик назывался по версии, и под каждую 2.8.x был свой exe
          $names = @('SoundCloud-2-Setup.exe', 'SoundCloud-2-Full-Setup-x64.exe', 'SoundCloud-2-Full-Setup-x64.exe.blockmap', 'latest.yml')
          foreach ($name in $names) { if (-not (Test-Path "build/$name")) { throw "Нет файла сборки build/$name" } }
          $files = @($names | ForEach-Object { (Resolve-Path "build/$_").Path })
          @('SoundCloud-2-Setup.exe', 'SoundCloud-2-Full-Setup-x64.exe') | ForEach-Object { "$((Get-FileHash "build/$_" -Algorithm SHA256).Hash.ToLower())  $_" } | Set-Content build/SHA256SUMS -Encoding ascii
          $files += (Resolve-Path build/SHA256SUMS).Path
          $notes = "SoundCloud 2 $version для Windows 10 и 11 x64.`n`nСкачай ``SoundCloud-2-Setup.exe`` (~100 КБ): он сам скачает и поставит клиент. Полный установщик без интернета: ``SoundCloud-2-Full-Setup-x64.exe``. Имена файлов в каждом релизе одни и те же, дальше клиент обновляется сам.`n`n$(git log -1 --format=%B)"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag @files --clobber }
          else { gh release create $tag @files --title "SoundCloud 2 $version" --notes $notes --latest }
